# 일회성 진단 — 도매꾹이 왜 모든 검색어에 0개를 주는지 응답 원문을 본다.
# 원인을 찾아 고치면 이 워크플로와 app/api/cron/domeggook-probe는 함께 지운다.
name: jarvis-domeggook-probe

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 검색해볼 단어
        required: false
        default: 보조배터리

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 도매꾹 응답 원문 확인
        run: |
          kw=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['KW']))")
          code=$(curl -sS -o /tmp/probe.json -w "%{http_code}" \
            --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.giucuu.com/api/cron/domeggook-probe?kw=$kw")
          echo "HTTP $code"
          python3 -m json.tool /tmp/probe.json || cat /tmp/probe.json
          test "$code" = "200"
        env:
          KW: ${{ inputs.keyword }}

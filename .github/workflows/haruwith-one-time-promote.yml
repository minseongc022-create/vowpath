name: Haruwith one-time production promote

on:
  push:
    branches: [codex/dajeong-event-planner]
    paths:
      - ".github/workflows/haruwith-one-time-promote.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HARUWITH_PREVIEW_URL: vowpath-git-codex-dajeong-ev-447412-minseongc022-2196s-projects.vercel.app
    steps:
      - name: Verify Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"

      - name: Promote verified Haruwith preview
        run: npx --yes vercel@58.9.2 promote "$HARUWITH_PREVIEW_URL" --yes --token "$VERCEL_TOKEN"

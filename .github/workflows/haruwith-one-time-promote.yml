name: Haruwith one-time production verify

on:
  push:
    branches: [codex/dajeong-event-planner]
    paths:
      - ".github/workflows/haruwith-one-time-promote.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HARUWITH_PRODUCTION_DEPLOYMENT: Bcic6HjSd2h3h445kpgmFUkagqoN
      VERCEL_SCOPE: minseongc022-2196s-projects
    steps:
      - name: Verify Vercel credentials
        run: test -n "$VERCEL_TOKEN"

      - name: Wait for promoted production deployment
        run: npx --yes vercel@58.9.2 inspect "$HARUWITH_PRODUCTION_DEPLOYMENT" --wait --timeout 5m --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

name: 자비스 비밀번호 재설정 (임시)

# ★ 한 번 쓰고 지운다 — 이 워크플로와 app/api/cron/jarvis-reset-password는
# 확인이 끝나면 함께 삭제한다. 이메일도 비밀번호도 입력받지 않는다:
# 소유자는 서버가 이미 알고, 새 비밀번호는 등록된 휴대폰으로만 간다.
# 이 로그에는 성공 여부와 가려진 전화번호 뒷자리만 남는다 — 비밀번호는
# 어떤 경우에도 이 로그에 나타나지 않는다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: 재설정 요청
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/reset.json -w "%{http_code}" \
            --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.giucuu.com/api/cron/jarvis-reset-password)
          echo "HTTP $code"
          cat /tmp/reset.json
          test "$code" = "200"

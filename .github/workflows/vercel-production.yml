name: Vercel production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Skip deploy hook — Vercel Git integration should deploy on push to main"
            echo "Optional: add VERCEL_DEPLOY_HOOK secret (Vercel → Project → Settings → Git → Deploy Hooks)"
            exit 0
          fi
          echo "Triggering Vercel production deploy hook…"
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Deploy hook triggered"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for Vercel production
        run: sleep 210

      # ★ 예전엔 여기서 구쿠(giucuu.com)와 옛 toss-shop(effiroad.com)을
      # 확인했다. 구쿠는 빠졌고 toss-shop은 통째로 삭제돼서, 검증이 늘
      # 실패하며 배포가 계속 빨간불이었다 — 늘 빨간 신호등은 신호등이
      # 아니라 아무도 안 보게 된다. 지금 실제로 도는 것(자비스)만 본다.
      - name: 자비스 배포 검증
        run: |
          for attempt in 1 2 3; do
            echo "=== 검증 시도 $attempt ==="
            node scripts/jarvis-deploy-verify.mjs && exit 0
            sleep 45
          done
          exit 1

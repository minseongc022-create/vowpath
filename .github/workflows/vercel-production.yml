name: Vercel production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Skip deploy hook — Vercel Git integration should deploy on push to main"
            echo "Optional: add VERCEL_DEPLOY_HOOK secret (Vercel → Project → Settings → Git → Deploy Hooks)"
            exit 0
          fi
          echo "Triggering Vercel production deploy hook…"
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Deploy hook triggered"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for Vercel production
        run: sleep 210

      - name: Verify Giu (giucuu.com) production
        run: |
          for attempt in 1 2 3; do
            echo "=== verify attempt $attempt ==="
            node scripts/giu-deploy-verify.mjs && exit 0
            sleep 45
          done
          exit 1

      - name: Verify Effiroad (effiroad.com) production
        run: node scripts/effiroad-deploy-verify.mjs

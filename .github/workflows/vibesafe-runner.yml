name: VibeSafe 브라우저 워커

# VibeSafe의 검사를 실제로 실행하는 곳.
#
# ★ 왜 GitHub Actions인가
#
# Playwright는 Chromium 바이너리와 수십 초의 실행 시간이 필요해서 서버리스
# 함수 안에서는 안정적으로 못 돈다. 그렇다고 초기 사용자 몇 명을 위해 VPS를
# 띄우면 그게 곧 고정비다. Actions는 스케줄 실행이 되고, 이 정도 부하에는
# 무료 한도로 충분하다 — 서버를 한 대도 사지 않고 제품이 돌아간다.
#
# 필요한 것 (Settings → Secrets and variables → Actions):
#   VIBESAFE_RUNNER_TOKEN  — Vercel에 넣은 것과 같은 값
#   VIBESAFE_API_URL       — 배포 주소 (Variables 또는 Secrets). 없으면 아래 기본값
#
# 둘 중 하나라도 없으면 이 워크플로는 **조용히 건너뛴다**. 설정 전에 실패
# 메일이 15분마다 날아오는 것만큼 빨리 알림을 꺼버리게 만드는 것도 없다.

on:
  schedule:
    # 15분마다. 검사 주기(VIBESAFE_CHECK_INTERVAL_HOURS, 기본 6시간)와는 다른
    # 개념이다 — 이건 "큐에 쌓인 걸 얼마나 빨리 집어가나"다.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "한 번에 처리할 최대 검사 수"
        required: false
        default: "5"
  # 앱이 검사를 큐에 넣자마자 워커를 깨우고 싶을 때 쓴다(선택).
  #   curl -X POST -H "Authorization: Bearer $GH_PAT" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/<owner>/<repo>/dispatches \
  #     -d '{"event_type":"vibesafe-run"}'
  repository_dispatch:
    types: [vibesafe-run]

permissions:
  contents: read

concurrency:
  # 워커 두 대가 동시에 도는 것 자체는 안전하다(큐가 compare-and-set으로
  # 집어간다). 다만 Actions 분을 낭비할 이유가 없어 한 번에 하나만 돌린다.
  group: vibesafe-runner
  cancel-in-progress: false

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 설정 확인
        id: guard
        env:
          RUNNER_TOKEN: ${{ secrets.VIBESAFE_RUNNER_TOKEN }}
        run: |
          if [ -z "$RUNNER_TOKEN" ]; then
            echo "VIBESAFE_RUNNER_TOKEN 시크릿이 없습니다 — 건너뜁니다."
            echo "  설정: Settings → Secrets and variables → Actions → New repository secret"
            echo "  값은 'npm run vibesafe:infra' 가 출력해 줍니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: "22"

      # 워커는 playwright 하나만 쓴다. 저장소 전체 의존성(1000개 넘는다)을
      # 설치하면 매 실행마다 몇 분이 그냥 날아간다.
      - name: Playwright 설치
        if: steps.guard.outputs.ready == 'true'
        run: |
          npm init -y --scope=@vibesafe >/dev/null 2>&1 || true
          npm install --no-save --no-audit --no-fund playwright@^1.49.1
          npx playwright install --with-deps chromium

      - name: 검사 실행
        if: steps.guard.outputs.ready == 'true'
        env:
          VIBESAFE_API_URL: ${{ vars.VIBESAFE_API_URL || secrets.VIBESAFE_API_URL || 'https://effiroad.com' }}
          VIBESAFE_RUNNER_TOKEN: ${{ secrets.VIBESAFE_RUNNER_TOKEN }}
          MAX_JOBS: ${{ github.event.inputs.max_jobs || '5' }}
        run: |
          # --once 를 여러 번 돌려 큐를 비운다. 할 일이 없으면 즉시 끝난다.
          for i in $(seq 1 "$MAX_JOBS"); do
            echo "--- 시도 $i/$MAX_JOBS ---"
            output=$(node scripts/vibesafe-runner.mjs --once 2>&1) || {
              echo "$output"
              echo "워커 실패 — 다음 스케줄에서 다시 시도합니다."
              exit 1
            }
            echo "$output"
            if echo "$output" | grep -q "대기 중인 검사가 없습니다"; then
              echo "큐가 비었습니다."
              break
            fi
          done

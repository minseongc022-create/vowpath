name: 자비스 진단 — getItemView 실제 응답 (임시)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 상세 조회
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 20 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.giucuu.com/api/cron/jarvis-diagnose-itemview?no=9502515"

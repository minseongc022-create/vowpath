services:
  - type: worker
    name: haruwith-reservation-worker
    runtime: node
    plan: 0.5c-512mb
    buildCommand: node --version
    startCommand: node scripts/haruwith-reservation-worker.mjs
    envVars:
      - key: HARUWITH_PUBLIC_BASE_URL
        value: https://haruwith.com
      - key: HARUWITH_WORKER_POLL_MS
        value: "5000"
      - key: HARUWITH_WORKER_TOKEN
        sync: false

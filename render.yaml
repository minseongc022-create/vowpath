services:
  - type: worker
    name: haruwith-reservation-worker
    runtime: node
    region: singapore
    buildCommand: node --version
    startCommand: npm run haruwith:reservation-worker
    envVars:
      - key: HARUWITH_PUBLIC_BASE_URL
        value: https://haruwith.com
      - key: HARUWITH_WORKER_POLL_MS
        value: "5000"
      - key: HARUWITH_WORKER_TOKEN
        sync: false

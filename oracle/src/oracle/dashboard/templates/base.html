<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}오라클{% endblock %}</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/static/oracle.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-wrap">
        <a class="logo" href="/" aria-label="자산">OR</a>
        <div>
          <p class="brand">오라클</p>
          <p class="sub">{% block subtitle %}내 돈을 목표까지{% endblock %}</p>
        </div>
      </div>
      {% block header_action %}
      <span class="chip {% if kill_switch.active %}chip-danger{% else %}chip-ok{% endif %}">
        {% if kill_switch.active %}정지{% elif autopilot.enabled %}자동{% else %}대기{% endif %}
      </span>
      {% endblock %}
    </header>

    {% if flash %}
    <div class="flash" id="flash">{{ flash }}</div>
    {% endif %}

    <main>
      {% block content %}{% endblock %}
    </main>

    <nav class="tabbar" aria-label="하단 메뉴">
      <a class="tab {% if active == 'money' or active == 'home' %}on{% endif %}" href="/">
        <span class="ico">₩</span><span>자산</span>
      </a>
      <a class="tab {% if active == 'ai' or active == 'trades' %}on{% endif %}" href="/ai">
        <span class="ico">✦</span><span>AI자동</span>
      </a>
      <a class="tab {% if active == 'settings' %}on{% endif %}" href="/settings">
        <span class="ico">⚙</span><span>설정</span>
      </a>
    </nav>
  </div>
  <script src="/static/oracle.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

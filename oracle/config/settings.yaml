# Project Oracle — MVP settings
# Risk minimization > return maximization

system:
  name: Project Oracle
  version: "0.1.0"
  timezone: America/New_York

universe:
  # MVP watchlist — expand later
  symbols:
    - SPY
    - QQQ
    - IWM
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
    - META
    - JPM
    - XOM
    - GLD
    - TLT

market_data:
  history_days: 365
  benchmark: SPY

# Agent weights for Decision Agent (before Risk veto)
# Must sum to ~1.0 for interpretability
agent_weights:
  market_intelligence: 0.10
  fundamental: 0.20
  technical: 0.20
  quant: 0.20
  sentiment: 0.10
  portfolio_manager: 0.20

# Risk Manager hard limits — these override all other agents
risk:
  max_position_pct: 0.15          # single name max weight
  max_sector_pct: 0.35            # soft check when sector known
  max_portfolio_volatility: 0.25  # annualized
  max_drawdown_halt: 0.12         # halt new buys if MDD from peak exceeds
  min_cash_pct: 0.10              # always keep cash buffer
  max_correlation_cluster: 0.85   # reject add if corr to existing > this
  atr_stop_multiple: 2.0          # suggested stop distance
  veto_confidence_floor: 0.55     # risk veto applies when risk conf >= this

decision:
  buy_threshold: 0.55
  add_threshold: 0.45
  reduce_threshold: -0.35
  sell_threshold: -0.55
  # Scores between reduce and add → Hold or Do Nothing

reporting:
  output_dir: ./data/reports
  include_agent_details: true

backtest:
  initial_cash: 100000
  commission_bps: 5
  slippage_bps: 5

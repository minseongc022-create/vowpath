[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-oracle"
version = "1.1.0"
description = "Project Oracle — personal multi-agent AI asset management system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Oracle Operator" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "httpx>=0.27",
  "ta>=0.11",
  "pyarrow>=15.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
oracle = "oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP042", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
"src/oracle/dashboard/app.py" = ["B008"]
